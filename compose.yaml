services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fieldnotes
      POSTGRES_PASSWORD: fieldnotes-dev
      POSTGRES_DB: fieldnotes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldnotes -d fieldnotes"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: